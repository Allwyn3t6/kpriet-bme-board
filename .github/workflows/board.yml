name: Build and publish BME board

on:
  schedule:
    - cron: "17 * * * *"      # every hour (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write     # daily data snapshot commit keeps the schedule active
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3
      - name: Build board (public sources only)
        run: python build_board.py --out site
      - name: Daily snapshot (keeps fallback data and keeps the schedule alive)
        run: |
          cp site/data.json data.json
          git config user.name "bme-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(git log -1 --format=%cd --date=format:%Y-%m-%d -- data.json 2>/dev/null)" != "$(date -u +%Y-%m-%d)" ]; then
            git add data.json && git commit -m "Daily board snapshot $(date -u +%Y-%m-%d)" && git push || true
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
